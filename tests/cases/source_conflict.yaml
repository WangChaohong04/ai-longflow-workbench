# 知识时效：已失效版本（travel_2023，2023-12-31 失效）应在检索阶段被排除，
# 回答采用现行有效版本（travel_2024）；过期版本与现行版本不再误报为"来源冲突"。
id: source_conflict
name: 过期知识版本被排除并采用现行版本
scenario: team_ops
goal: "出差住宿标准是多少？"
expect:
  answer_contains: ["住宿", "500"]
  conflict_flagged: false         # 过期版已排除，现行有效资料无冲突
  verified_not_true: false        # 现行版本可核验通过
  terminal_not_pending: true
